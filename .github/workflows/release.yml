name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: FntGenerator-Linux
            asset_name: FntGenerator-Linux.tar.gz
          - os: windows-latest
            artifact_name: FntGenerator-Windows
            asset_name: FntGenerator-Windows.zip
          - os: macos-latest
            artifact_name: FntGenerator-macOS
            asset_name: FntGenerator-macOS.zip

    steps:
      - uses: actions/checkout@v3

      # --- Linux Dependencies ---
      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libfreetype6-dev libgtk-3-dev xorg-dev

      # --- macOS Dependencies ---
      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install glfw freetype

      # --- Build (Common) ---
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        run: cmake --build build --config Release

      # --- Packaging ---
      
      # Windows: Zip the Executable
      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          cd build/Release
          powershell Compress-Archive -Path FntGenerator.exe -DestinationPath ../../${{ matrix.asset_name }}

      # macOS: Zip the .app Bundle
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cd build
          zip -r ../${{ matrix.asset_name }} FntGenerator.app

      # Linux: Tar the Executable
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cd build
          tar -czvf ../${{ matrix.asset_name }} FntGenerator

      # --- Upload Release Assets ---
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
